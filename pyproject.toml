[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonprofit-campaign-spend-cap"
version = "0.1.0"
description = "Cap monthly AI spending while reporting nonprofit campaign activity."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["run_campaign", "nonprofit_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
